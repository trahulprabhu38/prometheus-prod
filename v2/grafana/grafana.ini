# ===========================================================================
#  Grafana config overrides            mounted at /etc/grafana/grafana.ini
# ===========================================================================
#  Only the keys we deliberately change live here. Everything else stays on
#  Grafana's compiled-in defaults (this file replaces the packaged
#  grafana.ini, but not Grafana's internal default for any key we omit).
#
#  Precedence, lowest to highest:  built-in default  <  this file  <
#  GF_<SECTION>_<KEY> env var in docker-compose.yml.
#
#  $__env{VAR} substitutes an environment variable at startup. VAR reaches
#  the container through `env_file: [.env]` on the grafana service, so the
#  GitHub client secret never has to live in this file or in git.
# ===========================================================================

[server]
# Absolute public URL, as the browser sees it. Grafana derives the OAuth
# redirect_uri from this, so it MUST be https + the real host even though
# Traefik terminates TLS and forwards plain http to :3000 behind the scenes.
# Wrong value here => GitHub bounces the login with a redirect_uri mismatch.
root_url = https://grafana-infra.valura.co.in/

[auth.github]
enabled = true
name = GitHub
# New GitHub logins get an account auto-created (as Viewer - see [users]).
# This is independent of GF_USERS_ALLOW_SIGN_UP, which only governs the
# local email/password form.
allow_sign_up = true
client_id = $__env{GITHUB_OAUTH_CLIENT_ID}
client_secret = $__env{GITHUB_OAUTH_CLIENT_SECRET}
scopes = user:email,read:org
auth_url = https://github.com/login/oauth/authorize
token_url = https://github.com/login/oauth/access_token
api_url = https://api.github.com/user
# Hard gate: the login only completes for members of this GitHub org. A valid
# GitHub account outside it is rejected. read:org scope (above) is what lets
# Grafana check membership.
allowed_organizations = 2CentsCapital

[users]
# Every SSO user lands as Viewer. The Viewer role is granted View on the
# dev / staging / non-prod folders (set by scripts/grafana-setup-teams.py),
# so a new person sees those immediately on first login. prod + the global
# deployments folder still require an admin to add them to the Prod-View
# team. See docs/10-rbac-teams-access.md.
auto_assign_org_role = Viewer
